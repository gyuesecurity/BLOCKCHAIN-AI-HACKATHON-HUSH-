name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install (dev + llm + chain extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,llm,chain]'

      - name: Pytest
        run: pytest -q

      - name: Frontend syntax check
        run: for js in frontend/*.js; do node --check "$js"; done

      - name: Byte-compile Python
        run: python -m compileall -q backend scripts tests

      - name: Compile Solidity contract
        run: |
          out="$(mktemp -d)"
          npx --yes solc@0.8.24 --bin --abi contracts/HushDecisionRegistry.sol -o "$out"
          ls -la "$out"

      - name: Reject whitespace errors / conflict markers
        run: git diff --check HEAD

  provenance-reproducible:
    # The receipt's engine_code_hash must match across machines. This fails if
    # line endings drift (see .gitattributes) or fixtures desync from the
    # published dataset.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Verify test vectors + published dataset are in sync
        run: pytest -q tests/test_crypto_and_fixtures.py
