[project]
name = "hush-demo"
version = "0.1.0"
description = "HUSH privacy-preserving group decision demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pycryptodome>=3.20,<4",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

